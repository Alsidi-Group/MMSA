plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mmsa.records'
    compileSdk 34

    defaultConfig {
        applicationId "com.mmsa.records"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// التطبيق بدون أي مكتبات خارجية — كل الوظائف مبنية على واجهات أندرويد الأساسية
dependencies {
}
